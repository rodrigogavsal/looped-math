# Matriz de experimentos: 9 configuraciones principales x 3 semillas = 27 runs (+ 1 config opcional)
#
# Memoria: grad_accum: N parte cada paso en N trozos de batch_size/N ejemplos (el batch efectivo
# sigue siendo 64 y el gradiente es el mismo). Está puesto a 2 en los modelos de profundidad 8 y 12
# porque con batch 64 completo no caben en una GPU de 4 GB. Con una GPU de 8 GB o más se puede
# quitar. `python -m src.benchmark` comprueba qué cabe en cada máquina. Si aun así no cabe:
# grad_accum: 4, y como último recurso grad_checkpoint: true (más lento, mismo resultado).

seeds: [0, 1, 2]

defaults:
  vocab_size: 97
  context_length: 512
  emb_dim: 256
  n_heads: 8
  drop_rate: 0.0
  qkv_bias: false

experiments:
  # --- Familia GPT estándar (L bloques con pesos distintos, profundidad efectiva = L) ---
  - name: gpt_L1_d256
    arch: gpt
    n_layers: 1
    n_loops: 1
    emb_dim: 256
    n_heads: 8
    optional: false
    description: "GPT L=1 (idéntico en capacidad a Looped N=1)"

  - name: gpt_L2_d256
    arch: gpt
    n_layers: 2
    n_loops: 1
    emb_dim: 256
    n_heads: 8
    optional: false
    description: "GPT L=2 con pesos independientes por capa"

  - name: gpt_L4_d256
    arch: gpt
    n_layers: 4
    n_loops: 1
    emb_dim: 256
    n_heads: 8
    optional: false
    description: "GPT L=4 con pesos independientes por capa"

  - name: gpt_L8_d256
    arch: gpt
    n_layers: 8
    n_loops: 1
    emb_dim: 256
    n_heads: 8
    grad_accum: 2           # batch 64 en 2 trozos de 32: mismo resultado, la mitad de memoria (4 GB)
    optional: false
    description: "GPT L=8 con pesos independientes por capa"

  - name: gpt_L12_d256
    arch: gpt
    n_layers: 12
    n_loops: 1
    emb_dim: 256
    n_heads: 8
    grad_accum: 2           # batch 64 en 2 trozos de 32: mismo resultado, la mitad de memoria (4 GB)
    optional: true
    description: "GPT L=12 (profundidad del GPT-2 original)"

  # --- Familia Looped Transformer (1 bloque compartido aplicado N veces, profundidad efectiva = N) ---
  - name: looped_N2_d256
    arch: looped
    n_layers: 1
    n_loops: 2
    emb_dim: 256
    n_heads: 8
    optional: false
    description: "Looped Transformer con 1 bloque y N=2 iteraciones"

  - name: looped_N4_d256
    arch: looped
    n_layers: 1
    n_loops: 4
    emb_dim: 256
    n_heads: 8
    optional: false
    description: "Looped Transformer con 1 bloque y N=4 iteraciones"

  - name: looped_N8_d256
    arch: looped
    n_layers: 1
    n_loops: 8
    emb_dim: 256
    n_heads: 8
    grad_accum: 2           # batch 64 en 2 trozos de 32: mismo resultado, la mitad de memoria (4 GB)
    optional: false
    description: "Looped Transformer con 1 bloque y N=8 iteraciones"

  - name: looped_N12_d256
    arch: looped
    n_layers: 1
    n_loops: 12
    emb_dim: 256
    n_heads: 8
    grad_accum: 2           # batch 64 en 2 trozos de 32: mismo resultado, la mitad de memoria (4 GB)
    optional: true
    description: "Looped Transformer con 1 bloque y N=12 iteraciones"

  # --- Configuración opcional Iso-Parámetros + Iso-Profundidad con Looped N=4 ---
  - name: gpt_L4_d128
    arch: gpt
    n_layers: 4
    n_loops: 1
    emb_dim: 128
    n_heads: 4
    optional: false
    description: "GPT L=4, d=128 (~mismos parámetros y misma profundidad que Looped N=4, d=256)"
