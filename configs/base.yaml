# Configuración por defecto de arquitectura y entrenamiento

model:
  arch: looped
  vocab_size: 97          # 97 símbolos fijos de CharTokenizer (<pad>, <eos>, <unk> + 94 caracteres)
  context_length: 512
  emb_dim: 256
  n_heads: 8
  n_layers: 1
  n_unique_layers: 1
  n_loops: 4
  input_injection: false
  drop_rate: 0.0
  qkv_bias: false

train:
  lr: 1.0e-3
  min_lr: 1.0e-4
  min_lr_ratio: 0.1
  betas: [0.9, 0.95]
  weight_decay: 0.1
  warmup_steps: 200
  steps: 42000            # presupuesto validado en la calibración (docs/DATASET.md, sección 8.1)
  total_steps: 42000
  batch_size: 64          # batch efectivo; con grad_accum: N se procesa en N trozos
  grad_accum: 1
  grad_checkpoint: false  # true = menos memoria, ~30 % más lento, mismo resultado
  grad_clip: 1.0
  eval_every: 1000
  amp: true
  precision: auto       # bf16 si la GPU lo soporta; si no, fp16 con GradScaler (o fp32 en CPU)
  seeds: [0, 1, 2]
